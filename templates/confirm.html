<!DOCTYPE html>
<html>
<head>
    <title>Payment Success</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background-image:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            background:rgba(0,0,0,0.8);
            padding:40px;
            border-radius:20px;
            text-align:center;
            color:white;
            width:400px;
            box-shadow:0px 0px 15px black;
        }

        h1{
            color:lightgreen;
            font-size:40px;
        }

        p{
            font-size:22px;
            margin-top:20px;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            padding:15px 30px;
            background:orange;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-size:20px;
            transition:0.3s;
        }

        .btn:hover{
            background:red;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>✅ Payment Successful</h1>

        <p>
            Thank you for ordering from TasteGo 🍔🍕
        </p>

        <p>
            Your food will be delivered soon 🚴
        </p>

        <a href="{{ url_for('home') }}" class="btn">
            Back to Home
        </a>

    </div>

</body>
</html>
