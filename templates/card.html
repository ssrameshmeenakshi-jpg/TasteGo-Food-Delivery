<!DOCTYPE html>
<html>
<head>
    <title>My Cart</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:orange;
            color:white;
        }

        img{
            width:80px;
            height:80px;
            border-radius:10px;
        }

        .total{
            text-align:right;
            width:80%;
            margin:20px auto;
            font-size:22px;
            font-weight:bold;
        }

        .btn{
            display:block;
            width:200px;
            margin:20px auto;
            text-align:center;
            background:green;
            color:white;
            padding:15px;
            text-decoration:none;
            border-radius:10px;
        }

        .btn:hover{
            background:darkgreen;
        }

    </style>
</head>
<body>

<h1>🛒 My Cart</h1>

<table>

    <tr>
        <th>Image</th>
        <th>Food Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
    </tr>

    {% for item in cart %}

    <tr>
        <td>
            <img src="{{ url_for('static', filename=item[4]) }}">
        </td>

        <td>{{ item[1] }}</td>

        <td>₹{{ item[2] }}</td>

        <td>{{ item[3] }}</td>

        <td>₹{{ item[2] * item[3] }}</td>
    </tr>

    {% endfor %}

</table>

<div class="total">
    Grand Total : ₹{{ grand_total }}
</div>

<a href="{{ url_for('confirm') }}" class="btn">
    Proceed to Payment
</a>

</body>
</html>
