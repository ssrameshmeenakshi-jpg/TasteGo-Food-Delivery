<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>

        body{
            margin:0;
            padding:0;
            background-image:url("{{ url_for('static', filename='adminimg.jpg') }}");
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center;
            height:100vh;
            font-family:Arial, sans-serif;
        }

        .container{
            text-align:center;
            padding-top:80px;
        }

        h1{
            color:white;
            background:rgba(0,0,0,0.6);
            display:inline-block;
            padding:15px 30px;
            border-radius:10px;
        }

        .menu{
            margin-top:40px;
        }

        .menu a{
            display:block;
            width:250px;
            margin:15px auto;
            padding:15px;
            text-decoration:none;
            font-size:20px;
            color:white;
            background:rgba(0,0,0,0.7);
            border-radius:10px;
            transition:0.3s;
        }

        .menu a:hover{
            background:green;
            transform:scale(1.05);
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <div class="menu">

        <a href="{{ url_for('add_category') }}">
            Manage Categories
        </a>

        <a href="/manage_food">
            Manage Food Items
        </a>

        <a href="/manage_users">
            Manage Users
        </a>

        <a href="/manage_orders">
            Manage Orders
        </a>

        <a href="/feedback">
            View Feedback
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</div>

</body>
</html>
