<!DOCTYPE html>
<html>
<head>
<title>Feedback</title>
</head>
<body>

<h1>Customer Feedback</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>User</th>
    <th>Message</th>
</tr>

{% for f in feedbacks %}

<tr>
    <td>{{ f[0] }}</td>
    <td>{{ f[1] }}</td>
    <td>{{ f[2] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
