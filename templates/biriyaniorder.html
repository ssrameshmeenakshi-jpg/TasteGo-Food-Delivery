<!DOCTYPE html>
<html>
<head>
    <title>Chicken Biriyani Order</title>

    <style>

        body{
            font-family:Arial;
            text-align:center;
            background-image:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
            background-size:cover;
        }

        .box{
            background:white;
            width:350px;
            margin:auto;
            margin-top:100px;
            padding:30px;
            border-radius:15px;
        }

        img{
            width:250px;
            height:200px;
            border-radius:10px;
        }

        button{
            background:orange;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:10px;
            cursor:pointer;
        }

    </style>
</head>

<body>

    <div class="box">

        <img src="https://images.unsplash.com/photo-1633945274405-b6c8069047b0">

        <h1>Chicken Biriyani</h1>

        <h2>₹250</h2>

        Quantity :
        <input type="number" id="qty" value="1" min="1">

        <br><br>

        <button onclick="total()">Calculate</button>

        <h2 id="price"></h2>
        <a href="{{ url_for('confirm') }}">
        <button onclick="pay()">Pay Now</button>
        </a>

    </div>

    <script>

        function total(){

            let q = document.getElementById("qty").value;

            let total = q * 250;

            document.getElementById("price").innerHTML =
            "Total Amount : ₹" + total;
        }

    </script>

</body>
</html>
