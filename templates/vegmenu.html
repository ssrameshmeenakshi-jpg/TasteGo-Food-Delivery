<!DOCTYPE html>
<html>
<head>
    <title>Veg Menu</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:0;
        }

        h1{
            text-align:center;
            background:green;
            color:white;
            padding:20px;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:30px;
            padding:30px;
        }

        .card{
            width:300px;
            background:white;
            border-radius:15px;
            padding:15px;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        .card img{
            width:250px;
            height:200px;
            object-fit:cover;
            border-radius:10px;
        }

        button{
            background:orange;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:10px;
        }

    </style>
</head>
<body>

<h1>🥗 Veg Menu</h1>

<div class="container">

{% for food in foods %}

<div class="card">

    <img src="{{ url_for('static', filename=food[7]) }}">

    <h2>{{ food[1] }}</h2>

    <p>Price : ₹{{ food[4] }}</p>

    <p>{{ food[6] }}</p>

    <a href="{{ url_for('order') }}?id={{ food[0] }}">
        <button>Add to Cart</button>
    </a>

</div>

{% endfor %}

</div>

</body>
</html>
