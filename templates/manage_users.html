<!DOCTYPE html>
<html>
<head>
<title>Users</title>
</head>
<body>

<h1>Registered Users</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Username</th>
</tr>

{% for user in users %}

<tr>
    <td>{{ user[0] }}</td>
    <td>{{ user[1] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
