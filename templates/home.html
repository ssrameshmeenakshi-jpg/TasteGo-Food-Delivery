<!DOCTYPE html>
<html>
<head>
    <title>TasteGo - Home</title>

    <style>

        body{
            background-image:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center;
            height:100vh;
            margin:0;
            font-family:Arial, sans-serif;
        }

        .navbar{
            background:rgba(0,0,0,0.6);
            padding:20px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:20px;
            font-size:22px;
            font-weight:bold;
            transition:0.3s;
        }

        .navbar a:hover{
            color:yellow;
        }

        .content{
            text-align:center;
            margin-top:180px;
            color:white;
        }

        h1{
            font-size:50px;
            text-shadow:3px 3px 8px black;
        }

        h2{
            font-size:35px;
            margin-top:20px;
            text-shadow:2px 2px 5px black;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            padding:15px 35px;
            background:orange;
            color:white;
            text-decoration:none;
            font-size:22px;
            border-radius:10px;
            transition:0.3s;
        }

        .btn:hover{
            background:red;
            transform:scale(1.05);
        }

    </style>

</head>

<body>

<div class="navbar">
    <a href="{{ url_for('menu') }}">Menu</a>
    <a href="{{ url_for('contact') }}">Contact us</a>
    <a href="{{ url_for('about') }}">About us</a>
    <a href="{{ url_for('admin') }}">Admin log-in</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

    <div class="content">

        <h1>🍔 Welcome to TasteGo Food Delivery App 🍕</h1>

        <h2>Delicious Food Delivered Fast 🚴</h2>

    </div>

</body>
</html>
