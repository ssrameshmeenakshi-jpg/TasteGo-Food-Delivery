<!DOCTYPE html>
<html>
<head>
    <title>Logout - TasteGo</title>

    <style>

        body{
            margin:0;
            padding:0;
            background-image:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
            background-size:cover;
            background-repeat:no-repeat;
            background-position:center;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
        }

        .logout-box{
            background:rgba(0,0,0,0.7);
            padding:40px;
            border-radius:15px;
            text-align:center;
            color:white;
            width:400px;
        }

        h1{
            font-size:45px;
            margin-bottom:20px;
        }

        p{
            font-size:22px;
            margin-bottom:30px;
        }

        a{
            text-decoration:none;
            background:orange;
            color:white;
            padding:12px 25px;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
            transition:0.3s;
        }

        a:hover{
            background:red;
        }

    </style>

</head>

<body>

    <div class="logout-box">

        <h1>👋 Logged Out</h1>

        <p>You have successfully logged out from TasteGo.</p>

        <a href="/login">Login Again</a>

    </div>

</body>
</html>
